<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra Interactives Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-block">
        <span class="logo-word">TIERRA</span>
        <span class="logo-divider">/</span>
        <span class="logo-sub">INTERACTIVES</span>
      </div>
      <div class="header-right">
        <span class="card-count" id="cardCount">— cards</span>
      </div>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ECOM">ECOM</button>
      <button class="filter-btn" data-filter="BEV">BEV</button>
      <button class="filter-btn" data-filter="Sleep">Sleep</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name or client…" autocomplete="off" />
    </div>
  </header>

  <main class="grid" id="cardGrid"></main>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-layout">
        <div class="modal-preview" id="modalPreview">
          <div class="phone-shell">
            <div class="phone-notch"></div>
            <div class="phone-screen">
              <iframe id="modalIframe" title="Interactive Preview" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>
              <div class="cta-badge" id="ctaBadge">
                <span class="cta-badge-dot" id="ctaDot"></span>
                <span id="ctaBadgeText">CTA: bottom — leave blank</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-info" id="modalInfo">
          <div class="modal-tag" id="modalTag"></div>
          <h2 class="modal-title" id="modalTitle"></h2>
          <p class="modal-client" id="modalClient"></p>
          <p class="modal-date" id="modalDate"></p>

          <div class="modal-section">
            <div class="modal-label">CTA Button</div>
            <div class="cta-row">
              <span class="cta-swatch" id="modalCtaSwatch"></span>
              <span class="cta-info" id="modalCtaInfo"></span>
            </div>
          </div>

          <div class="modal-section">
            <div class="modal-label">Designer notes</div>
            <div class="notes-box">
              The CTA button is auto-injected by Axon at the <strong>bottom</strong> of the frame. Leave that zone clear in the source video — do not place text or product imagery within the bottom ~15% of the frame.
            </div>
          </div>

          <div class="modal-actions">
            <a class="btn-primary" id="modalDriveLink" href="#" target="_blank" rel="noopener">
              Open Raw Files →
            </a>
            <button class="btn-secondary" id="modalCopyBtn">Copy HTML filename</button>
          </div>

          <div class="copy-confirm" id="copyConfirm">Copied!</div>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
