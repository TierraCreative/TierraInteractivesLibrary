<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra Interactives Library</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-block">
        <img src="Tierra_Logo.png" alt="Tierra" class="site-logo" />
        <span class="logo-divider">/</span>
        <span class="logo-sub">AXON INTERACTIVES</span>
      </div>
      <span class="card-count" id="cardCount">28 cards</span>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ECOM">ECOM</button>
      <button class="filter-btn" data-filter="BEV">BEV</button>
      <button class="filter-btn" data-filter="Sleep">Sleep</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name or client…" autocomplete="off" />
    </div>
  </header>

  <main class="grid" id="cardGrid"></main>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-layout">

        <div class="modal-preview">
          <div class="phone-shell">
            <div class="phone-notch"></div>
            <div class="phone-screen">
              <video id="modalVideo" autoplay muted loop playsinline></video>
              <div class="modal-cta-btn" id="modalCtaBtn">Shop Now</div>
            </div>
          </div>
        </div>

        <div class="modal-info">
          <div class="modal-tag" id="modalTag"></div>
          <h2 class="modal-title" id="modalTitle"></h2>
          <p class="modal-client" id="modalClient"></p>
          <p class="modal-date" id="modalDate"></p>

          <div class="modal-section">
            <div class="modal-label">CTA button</div>
            <div class="cta-row">
              <span class="cta-swatch" id="modalCtaSwatch"></span>
              <span class="cta-info" id="modalCtaInfo"></span>
            </div>
          </div>

          <div class="modal-section">
            <div class="modal-label">Designer notes</div>
            <div class="notes-box">
              The <strong>Shop Now</strong> CTA button is auto-injected by Axon at the <strong>bottom</strong> of the frame. Leave the bottom ~15% of the source video clear — no text, product, or key visuals in that zone.
            </div>
          </div>

          <div class="modal-actions">
            <a class="btn-primary" id="modalDriveLink" href="#" target="_blank" rel="noopener">Open raw files →</a>
            <button class="btn-secondary" id="modalCopyBtn">Copy video URL</button>
          </div>
          <div class="copy-confirm" id="copyConfirm">Copied!</div>
        </div>

      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
